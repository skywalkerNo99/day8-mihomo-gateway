name: day8-tun

x-image: &gateway-image
  image: day8-mihomo-gateway:container-tun
  build:
    context: .
    dockerfile: containers/Dockerfile

services:
  enroll:
    <<: *gateway-image
    profiles: [setup]
    network_mode: none
    command: [enroll-container]
    volumes:
      - ./secrets:/app/secrets:ro
      - unlock:/var/lib/day8-unlock

  proxy:
    <<: *gateway-image
    command: [run-container-tun]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    ports:
      - "127.0.0.1:7890:7890"
    volumes:
      - ./secrets:/app/secrets:ro
      - unlock:/var/lib/day8-unlock:ro
      - state:/app/.local
    healthcheck:
      test: [CMD, python3, gateway, status]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

networks:
  default:
    enable_ipv6: false

volumes:
  unlock:
  state:
